<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824px rounded square on a 1024 canvas. The rim and shadow keep it apart from light docks
       and taskbars; an Icon Composer version for a packaged Mac app would leave both to the system. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE3E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="200" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="198" fill="none" stroke="#0B1F44" stroke-opacity="0.14" stroke-width="4"/>
  <!-- The tunnel and its three lanes, the same glyph as TunnelIcon in packages/ui/src/icons.tsx. The tray draws it wider and without lanes, to fit a count (apps/desktop/src/main/tray/glyph.ts). -->
  <g transform="translate(176 176) scale(10.5)" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 51V33a20 20 0 0 1 40 0V51" stroke="#2357C6"/>
    <path d="M22 51v-7" stroke="#16935F"/>
    <path d="M32 51v-12" stroke="#E08A12"/>
    <path d="M42 51v-7" stroke="#2357C6"/>
  </g>
</svg>
